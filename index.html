<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangla Episode - Premium IPTV</title>
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;background:#0a0a0f;color:#e8e8f0;min-height:100vh;overflow-x:hidden}
  .app{display:flex;flex-direction:column;height:100vh;background:#0a0a0f}
  
  /* টপবার */
  .topbar{display:flex;align-items:center;padding:14px 24px;background:#111118;border-bottom:0.5px solid rgba(255,255,255,0.08);height:60px;flex-shrink:0}
  .logo{font-size:18px;font-weight:600;color:#a78bfa;letter-spacing:-0.3px}
  .logo span{color:#e8e8f0}
  
  /* মেইন কন্টেনার */
  .main{display:flex;flex:1;overflow:hidden;}
  
  /* সাইডবার (Screenshot 2026-06-12 004050.png লেআউট ম্যাচ) */
  .sidebar{width:270px;background:#0e0e18;border-right:0.5px solid rgba(255,255,255,0.07);flex-shrink:0;overflow-y:auto;}
  .sidebar::-webkit-scrollbar {width: 5px;}
  .sidebar::-webkit-scrollbar-track {background: transparent;}
  .sidebar::-webkit-scrollbar-thumb {background: rgba(255,255,255,0.1); border-radius: 10px;}

  /* ক্যাটাগরি ফোল্ডার হেডার */
  .folder-wrapper {border-bottom: 0.5px solid rgba(255,255,255,0.02);}
  .folder-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: #11111d;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  .folder-header:hover { background: #151525; }
  .folder-title-wrap { display: flex; align-items: center; gap: 10px; }
  .folder-title-wrap i { color: #a78bfa; font-size: 16px; }
  .folder-title { font-size: 13px; font-weight: 600; color: #c8c8d8; text-transform: uppercase; letter-spacing: 0.3px; }
  .chevron-icon { font-size: 14px; color: #666; transition: transform 0.2s; }
  
  /* ফোল্ডার চ্যানেল লিস্ট */
  .folder-channels {
    display: none;
    background: #090911;
  }
  
  /* ওপেন স্টেট */
  .folder-wrapper.open .chevron-icon { transform: rotate(180deg); color: #a78bfa; }
  .folder-wrapper.open .folder-channels { display: block; }

  /* চ্যানেল আইটেম স্টাইল */
  .channel-item{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;transition: background 0.1s;border-left:3px solid transparent}
  .channel-item:hover{background:rgba(167,139,250,0.04)}
  .channel-item.active{background:rgba(167,139,250,0.08);border-left-color:#a78bfa}
  .channel-item.active .ch-name{color:#a78bfa;font-weight: 600;}
  
  .channel-logo{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
  .ch-name{font-size:13px;color:#c8c8d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ch-live{font-size:9px;color:#22c55e;background:rgba(34,197,94,0.1);padding:2px 6px;border-radius:4px;margin-left:auto;font-weight:600;letter-spacing: 0.5px}

  /* প্লেয়ার এরিয়া */
  .content{flex:1;padding:30px;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;}
  .player-section{background:#111118;border-radius:16px;overflow:hidden;border:0.5px solid rgba(255,255,255,0.07);width:100%;max-width:880px;box-shadow: 0 20px 40px rgba(0,0,0,0.4);}
  .player-wrap{position:relative;background:#000;aspect-ratio:16/9;width:100%;}
  video {position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}

  /* রেসপন্সিভ লেআউট */
  @media (max-width: 767px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; height: 300px; border-right: none; border-top: 0.5px solid rgba(255,255,255,0.07); }
    .content { padding: 15px; }
  }
  </style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo">Bangla <span>Episode</span></div>
  </div>

  <div class="main">
    <div class="sidebar">
      
      <!-- ফোল্ডার ১: Bangla All Channel -->
      <div class="folder-wrapper open">
        <div class="folder-header" onclick="toggleFolder(this)">
          <div class="folder-title-wrap">
            <i class="ti ti-folder"></i>
            <span class="folder-title">Bangla All Channel</span>
          </div>
          <i class="ti ti-chevron-down chevron-icon"></i>
        </div>
        
        <div class="folder-channels">
          <div class="channel-item active" onclick="selectChannel(this, 'https://tvsen6.aynaott.com/anandatv/index.m3u8?e=1779283759&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=504b9350b4703116ca4ab20e4013288e')">
            <div class="channel-logo" style="background:#2d1b4e;color:#a78bfa">AT</div>
            <span class="ch-name">Ananda TV</span>
            <span class="ch-live">LIVE</span>
          </div>

          <div class="channel-item" onclick="selectChannel(this, 'https://tvsen6.aynaott.com/banglatv/index.m3u8?e=1779283758&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=f3e9e2737e35147900c0f4add619ead6')">
            <div class="channel-logo" style="background:#0a1e3d;color:#60a5fa">BT</div>
            <span class="ch-name">Bangla TV</span>
            <span class="ch-live">LIVE</span>
          </div>

          <div class="channel-item" onclick="selectChannel(this, 'https://tvsen6.aynaott.com/durontotv-live/index.m3u8?e=1779283757&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=3da514e08a15c80daed60a18b3f423fa')">
            <div class="channel-logo" style="background:#2a1e00;color:#fbbf24">DT</div>
            <span class="ch-name">Duronto TV</span>
            <span class="ch-live">LIVE</span>
          </div>

          <div class="channel-item" onclick="selectChannel(this, 'https://tvsen6.aynaott.com/boishakhitv/index.m3u8?e=1779283755&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=f3f4ec98ffbd9567c21e8b2ee98e32d5')">
            <div class="channel-logo" style="background:#0a2d1a;color:#4ade80">BT</div>
            <span class="ch-name">Boishakhi TV</span>
            <span class="ch-live">LIVE</span>
          </div>
        </div>
      </div>

      <!-- ফোল্ডার ২: News & Sports Channels -->
      <div class="folder-wrapper">
        <div class="folder-header" onclick="toggleFolder(this)">
          <div class="folder-title-wrap">
            <i class="ti ti-folder"></i>
            <span class="folder-title">News & Sports</span>
          </div>
          <i class="ti ti-chevron-down chevron-icon"></i>
        </div>
        
        <div class="folder-channels">
          <div class="channel-item" onclick="selectChannel(this, 'https://tvsen6.aynaott.com/somoytv/index.m3u8?e=1779283766&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=269246b8a31fb3a656624d71e10e447d')">
            <div class="channel-logo" style="background:#0a1e3d;color:#60a5fa">ST</div>
            <span class="ch-name">Somoy News TV</span>
            <span class="ch-live">LIVE</span>
          </div>

          <div class="channel-item" onclick="selectChannel(this, 'https://tvsen7.aynaott.com/tsports-hd/index.m3u8?e=1779283784&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=3b4c5a2cfa872fa7f91ffbfb4aa0f658')">
            <div class="channel-logo" style="background:#2d1b4e;color:#a78bfa">TS</div>
            <span class="ch-name">T Sports HD</span>
            <span class="ch-live">LIVE</span>
          </div>
        </div>
      </div>

    </div>

    <div class="content">
      <div class="player-section">
        <div class="player-wrap">
          <video id="video" controls autoplay playsinline></video>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  let hls = null;

  // HLS প্লেয়ার ইনিশিয়ালি মাত্র ১ বার রান হবে (পারফরম্যান্স বুস্টের জন্য)
  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      maxBufferLength: 10
    });
    hls.attachMedia(video);
  }

  // ফোল্ডার টগল ফাংশন (স্মুথ এবং লাইটওয়েট)
  function toggleFolder(headerElement) {
    headerElement.parentElement.classList.toggle('open');
  }

  // চ্যানেল পরিবর্তনের ফাংশন (কোনো জ্যাম বা হ্যাং হবে না)
  function selectChannel(el, url) {
    document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    if (hls) {
      hls.loadSource(url);
      video.play().catch(() => {});
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().catch(() => {});
    }
  }

  // পেজ লোড হলে অ্যাক্টিভ চ্যানেলটি অটো প্লে হবে
  window.onload = () => {
    const defaultChannel = document.querySelector('.channel-item.active');
    if (defaultChannel) {
      defaultChannel.click();
    }
  };
</script>

</body>
</html>
