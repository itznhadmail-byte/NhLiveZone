<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangla Episode | Live IPTV</title>
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* বেসিক রিসেট */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0f; color: #e8e8f0; min-height: 100vh; }
    .app { display: flex; flex-direction: column; height: 100vh; }

    /* টপবার */
    .topbar { padding: 15px 24px; background: #111118; border-bottom: 0.5px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 20px; font-weight: 600; color: #a78bfa; letter-spacing: -0.5px; }

    /* মেইন লেআউট */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* সাইডবার ডিজাইন */
    .sidebar { width: 280px; background: #0e0e18; border-right: 0.5px solid rgba(255,255,255,0.07); overflow-y: auto; height: 100%; padding: 20px 0; }
    .sidebar-section { margin-bottom: 25px; }
    .sidebar-title { font-size: 11px; font-weight: 700; color: #666; padding: 0 20px 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .channel-item { display: flex; align-items: center; gap: 12px; padding: 10px 20px; cursor: pointer; transition: 0.2s; border-left: 3px solid transparent; }
    .channel-item:hover { background: rgba(167,139,250,0.05); }
    .channel-item.active { background: rgba(167,139,250,0.1); border-left-color: #a78bfa; color: #a78bfa; }
    .channel-logo { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
    .ch-name { font-size: 13px; }

    /* কন্টেন্ট এরিয়া */
    .content { flex: 1; padding: 30px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
    .player-section { width: 100%; max-width: 900px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    video { width: 100%; aspect-ratio: 16/9; background: #000; outline: none; }

    /* রেসপন্সিভ */
    @media (max-width: 767px) {
      .main { flex-direction: column; }
      .sidebar { width: 100%; height: 300px; order: 2; }
      .content { padding: 15px; order: 1; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo">Bangla Episode</div>
  </div>

  <div class="main">
    <div class="sidebar">
      
      <!-- ১. সংবাদ বিভাগ -->
      <div class="sidebar-section">
        <div class="sidebar-title">সংবাদ (News)</div>
        <div class="channel-item" onclick="selectChannel(this, 'Somoy News', 'https://tvsen6.aynaott.com/somoytv/index.m3u8?e=1779283766&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=269246b8a31fb3a656624d71e10e447d')">
          <div class="channel-logo" style="background:#1e3a8a; color:#60a5fa">ST</div>
          <span class="ch-name">Somoy News</span>
        </div>
      </div>

      <!-- ২. বিনোদন বিভাগ -->
      <div class="sidebar-section">
        <div class="sidebar-title">বিনোদন (Entertainment)</div>
        <div class="channel-item active" onclick="selectChannel(this, 'Ananda TV', 'https://tvsen6.aynaott.com/anandatv/index.m3u8?e=1779283759&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=504b9350b4703116ca4ab20e4013288e')">
          <div class="channel-logo" style="background:#4c1d95; color:#a78bfa">AT</div>
          <span class="ch-name">Ananda TV</span>
        </div>
        <div class="channel-item" onclick="selectChannel(this, 'Deepto TV', 'https://tvsen5.aynaott.com/DeeptoTVHD/index.m3u8?e=1779283753&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=12455a1472f0cbf29e22967cc44a49c0')">
          <div class="channel-logo" style="background:#064e3b; color:#34d399">DT</div>
          <span class="ch-name">Deepto TV</span>
        </div>
      </div>

      <!-- ৩. খেলাধুলা বিভাগ -->
      <div class="sidebar-section">
        <div class="sidebar-title">খেলাধুলা (Sports)</div>
        <div class="channel-item" onclick="selectChannel(this, 'T Sports', 'https://tvsen7.aynaott.com/tsports-hd/index.m3u8?e=1779283784&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=3b4c5a2cfa872fa7f91ffbfb4aa0f658')">
          <div class="channel-logo" style="background:#991b1b; color:#f87171">TS</div>
          <span class="ch-name">T Sports HD</span>
        </div>
      </div>

    </div>

    <div class="content">
      <div class="player-section">
        <video id="video" controls autoplay playsinline></video>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  let hls = new Hls();

  function selectChannel(el, name, url) {
    // অ্যাক্টিভ ক্লাস ম্যানেজমেন্ট
    document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    // ভিডিও প্লেয়ার লোড
    if (Hls.isSupported()) {
      hls.destroy();
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    }
  }

  // অটো লোড প্রথম চ্যানেল
  window.onload = () => {
    document.querySelector('.channel-item.active').click();
  };
</script>

</body>
</html>
