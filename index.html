<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NhLiveZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#060c18;
  --bg2:#0b1422;
  --bg3:#101e35;
  --bg4:#16274a;
  --border:rgba(100,150,255,0.08);
  --border2:rgba(100,150,255,0.18);
  --text:#eef2ff;
  --text2:#7d98cc;
  --text3:#3d5578;
  --accent:#4f7df0;
  --accent2:#7c5cf0;
  --bd:#5b9bff;
  --in:#f0b440;
  --int:#4fd0e8;
  --sp:#b39bff;
  --fifa:#ffd700;
  --red:#ef4444;
  --green:#4ade80;
  --radius:14px;
  --radius-sm:10px;
  --radius-xs:7px;
}

html,body{height:100%;background:var(--bg);overflow:hidden}

.tv-app{
  display:flex;flex-direction:column;
  width:100%;height:100vh;
  background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,sans-serif;
  overflow:hidden;
}

/* ══════════════ TOP BAR ══════════════ */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:relative;z-index:50;
  flex-wrap:wrap;flex-shrink:0;
}

.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;text-decoration:none}
.brand-img{
  height:36px;width:36px;object-fit:contain;
  border-radius:9px;flex-shrink:0;
}
.brand-svg{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#1a2a5e 0%,#0d1a3a 100%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.brand-name{
  font-family:'Rajdhani',sans-serif;
  font-size:20px;font-weight:700;letter-spacing:.02em;
  line-height:1;
}
.brand-name .nh{
  background:linear-gradient(135deg,#5b9bff,#7c5cf0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.brand-name .live{color:var(--text)}
.brand-name .zone{
  background:linear-gradient(135deg,#7c5cf0,#4fd0e8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.live-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.22);
  padding:3px 9px;border-radius:20px;
  font-size:10px;font-weight:700;color:#ff7575;letter-spacing:.06em;flex-shrink:0;
}
.pulse{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

.topbar-search{
  display:flex;align-items:center;gap:8px;
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0 12px;width:200px;flex-shrink:0;
  transition:border-color .15s,box-shadow .15s;
}
.topbar-search:focus-within{border-color:rgba(79,125,240,0.4);box-shadow:0 0 0 3px rgba(79,125,240,0.08)}
.topbar-search i{color:var(--text3);font-size:14px;flex-shrink:0}
.topbar-search input{
  background:transparent;border:none;outline:none;
  font-size:12.5px;color:var(--text);width:100%;padding:8px 0;
  font-family:'Inter',sans-serif;
}
.topbar-search input::placeholder{color:var(--text3)}

.topbar-spacer{flex:1}

.cat-row{display:flex;align-items:center;gap:5px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;width:100%}
.cat-row::-webkit-scrollbar{display:none}

.cat-pill{
  display:flex;align-items:center;gap:5px;
  padding:5px 13px;border-radius:20px;
  font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text2);
  transition:all .15s;white-space:nowrap;font-family:'Inter',sans-serif;
}
.cat-pill:hover{background:var(--bg3);color:var(--text)}
.cat-pill.on-all  {background:rgba(79,125,240,0.12);border-color:rgba(79,125,240,0.3);color:#aac4ff}
.cat-pill.on-bd   {background:rgba(91,155,255,0.12);border-color:rgba(91,155,255,0.3);color:#b8d4ff}
.cat-pill.on-in   {background:rgba(240,180,64,0.1); border-color:rgba(240,180,64,0.3);color:#f8d090}
.cat-pill.on-int  {background:rgba(79,208,232,0.1); border-color:rgba(79,208,232,0.3);color:#8ee8f4}
.cat-pill.on-sp   {background:rgba(179,155,255,0.1);border-color:rgba(179,155,255,0.3);color:#cfc0ff}
.cat-pill.on-fifa {
  background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(255,165,0,0.1));
  border-color:rgba(255,215,0,0.4);color:#ffd700;
  box-shadow:0 0 10px rgba(255,215,0,0.1);
}
.cat-pill.on-fifa i{color:#ffd700}

/* ══════════════ BODY ══════════════ */
.body{display:flex;flex:1;min-height:0;overflow:hidden}

/* ══════════════ SIDEBAR ══════════════ */
.sidebar{
  width:230px;min-width:230px;
  border-right:1px solid var(--border);
  overflow-y:auto;padding:6px 5px;
  background:var(--bg);
  scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

.section-label{
  display:flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;color:var(--text3);
  letter-spacing:.12em;text-transform:uppercase;
  padding:10px 10px 5px;
}
.section-label.fifa-label{
  color:var(--fifa);
  text-shadow:0 0 8px rgba(255,215,0,0.3);
}

.ch-card{
  display:flex;align-items:center;gap:9px;
  padding:8px 9px;border-radius:var(--radius-sm);
  cursor:pointer;transition:all .15s;margin-bottom:2px;
  border:1px solid transparent;position:relative;
}
.ch-card:hover{background:var(--bg2)}
.ch-card.active{
  background:var(--bg3);border-color:rgba(79,125,240,0.2);
  box-shadow:inset 3px 0 0 var(--accent);
}
.ch-card.active .ch-n{color:#a0c0ff}
.ch-card.no-url{opacity:.5}
.ch-card.no-url:hover{opacity:.72}

.ch-logo{width:36px;height:36px;border-radius:var(--radius-xs);object-fit:contain;background:var(--bg2);flex-shrink:0;border:1px solid var(--border);padding:2px}
.ch-avatar{width:36px;height:36px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;font-weight:700;border:1px solid var(--border)}
.ch-meta{flex:1;min-width:0}
.ch-n{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ch-s{font-size:10.5px;color:var(--text3);margin-top:1px;font-weight:400}
.live-pip{width:6px;height:6px;border-radius:50%;flex-shrink:0;opacity:.85}
.pip-bd{background:var(--bd)}.pip-in{background:var(--in)}.pip-int{background:var(--int)}.pip-sp{background:var(--sp)}.pip-fifa{background:var(--fifa)}
.soon-tag{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.04em;flex-shrink:0}
.no-ch{padding:20px 10px;text-align:center;font-size:11.5px;color:var(--text3)}
.no-ch i{font-size:20px;display:block;margin-bottom:7px;opacity:.4}

/* ══════════════ PLAYER ══════════════ */
.player-col{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden; background: var(--bg);}

/* Fullscreen Specific CSS */
.player-col:-webkit-full-screen { width:100vw; height:100vh; background:#000; display:flex; flex-direction:column; }
.player-col:-ms-fullscreen { width:100vw; height:100vh; background:#000; display:flex; flex-direction:column; }
.player-col:fullscreen { width:100vw; height:100vh; background:#000; display:flex; flex-direction:column; }
.player-col:fullscreen .player-screen,
.player-col:-webkit-full-screen .player-screen { max-height:none; height:100%; flex:1; aspect-ratio:auto; width:100%; }
.player-col:fullscreen #vid,
.player-col:-webkit-full-screen #vid { object-fit:cover; }
.player-col:fullscreen .now-bar,
.player-col:-webkit-full-screen .now-bar { display:none !important; }
.player-col:fullscreen .ctrl-bar,
.player-col:-webkit-full-screen .ctrl-bar { flex-shrink:0; }

.player-screen{
  width:100%;background:#020509;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  flex:1 1 auto;
  min-height:0;
}
.player-screen.cursor-hidden{cursor:none}
.player-screen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 40%,rgba(79,125,240,0.04),transparent 60%),
             radial-gradient(ellipse at 70% 70%,rgba(124,92,240,0.03),transparent 60%);
  pointer-events:none;
}

.idle-state{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:1}
.idle-logo-wrap{
  width:90px;height:90px;border-radius:50%;
  background:rgba(10,18,40,0.8);
  border:1px solid rgba(79,125,240,0.18);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(79,125,240,0.08);
}
.idle-logo-wrap svg{width:52px;height:52px}
.idle-title{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--text2);letter-spacing:.05em}
.idle-sub{font-size:11.5px;color:var(--text3)}

.loading-state{display:none;flex-direction:column;align-items:center;gap:12px;z-index:1}
.spinner{width:36px;height:36px;border:2px solid rgba(255,255,255,0.06);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-logo{width:40px;height:40px;border-radius:var(--radius-xs);object-fit:contain;background:rgba(255,255,255,0.05);border:1px solid var(--border)}
.loading-ch{font-size:13px;color:var(--text2);font-weight:500}

.player-tl{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:7px;z-index:5}
.live-tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:4px;letter-spacing:.06em;color:#fff}
.ch-now{font-size:12px;font-weight:600;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.5)}

.quality-badge{
  position:absolute;top:12px;right:14px;z-index:5;
  display:none;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);
  border-radius:5px;padding:3px 8px;
  font-size:10px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:.04em;
  backdrop-filter:blur(4px);
}

.video-wrap{position:absolute;inset:0;display:none}
.video-wrap video{width:100%;height:100%;object-fit:contain;background:#000}
#vid{width:100%;height:100%;object-fit:contain;background:#000} /* fix: kalo bar/red mark bad dewar jonno */
.screen-grad{position:absolute;inset:0;pointer-events:none;z-index:2;display:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.4) 0%,transparent 25%,transparent 75%,rgba(0,0,0,.3) 100%)}
.err-msg{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.28);
  color:#ff9090;font-size:12px;padding:6px 14px;border-radius:var(--radius-xs);
  white-space:nowrap;display:none;z-index:10;backdrop-filter:blur(6px);
}

.controls-overlay{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(8px);
  transition:opacity .22s,transform .22s;
  pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.55) 0%,rgba(0,0,0,.0) 100%);
  padding-top:30px;
}
.player-screen.show-controls .controls-overlay,
.player-screen.is-paused .controls-overlay,
.player-screen.is-idle .controls-overlay{
  opacity:1;transform:translateY(0);pointer-events:auto;
}
.player-tl,.quality-badge{transition:opacity .22s}
.player-screen:not(.show-controls):not(.is-paused):not(.is-idle) .player-tl,
.player-screen:not(.show-controls):not(.is-paused):not(.is-idle) .quality-badge{opacity:0}

.pbar-wrap{
  position:relative;height:4px;background:rgba(255,255,255,0.15);flex-shrink:0;
  cursor:pointer;transition:height .12s;
}
.pbar-wrap:hover{height:7px}
.pbar-buffered{position:absolute;left:0;top:0;height:100%;width:100%;background:rgba(255,255,255,0.2)}
.pbar-fill{position:absolute;left:0;top:0;height:100%;width:0%;background:linear-gradient(to right,var(--accent2),var(--accent))}
.pbar-dot{
  position:absolute;top:50%;left:0%;width:13px;height:13px;border-radius:50%;
  background:var(--accent);transform:translate(-50%,-50%) scale(0);
  transition:transform .12s;box-shadow:0 0 4px rgba(0,0,0,.4);
}
.pbar-wrap:hover .pbar-dot{transform:translate(-50%,-50%) scale(1)}

.ctrl-bar{
  display:flex;align-items:center;gap:4px;
  padding:6px 12px;background:transparent;flex-shrink:0;
}
.ctrl-btn{
  width:38px;height:38px;border-radius:8px;
  background:transparent;border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text2);transition:all .15s;flex-shrink:0;
}
.ctrl-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.ctrl-btn.play-btn{
  background:transparent;border:none;color:var(--text);box-shadow:none;
}
.ctrl-btn.play-btn:hover{background:rgba(255,255,255,0.08);box-shadow:none;transform:none}
.ctrl-btn i{font-size:19px}
.ctrl-btn.play-btn i{font-size:21px}

.ctrl-time{
  font-size:12px;color:var(--text2);font-weight:500;letter-spacing:.01em;
  white-space:nowrap;flex-shrink:0;margin-left:2px;
  font-family:'Rajdhani',sans-serif;
}

.vol-inline{display:flex;align-items:center;gap:0;flex-shrink:0}
.vol-inline input{
  width:0;opacity:0;transition:width .15s,opacity .15s,margin .15s;
  accent-color:#fff;height:3px;margin-left:0;cursor:pointer;
}
.vol-inline:hover input,.vol-inline.show input{width:64px;opacity:1;margin-left:4px}

.quality-wrap{position:relative;flex-shrink:0}
.quality-menu{
  position:absolute;bottom:calc(100% + 10px);right:-6px;
  background:rgba(28,28,28,.96);border:1px solid var(--border2);
  border-radius:var(--radius-xs);padding:4px 0;
  display:none;flex-direction:column;z-index:30;min-width:170px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);backdrop-filter:blur(8px);
  max-height:260px;overflow-y:auto;
}
.quality-menu.open{display:flex}
.qmenu-head{
  display:flex;align-items:center;gap:8px;padding:9px 14px;
  font-size:13px;font-weight:600;color:var(--text);cursor:pointer;
  border-bottom:1px solid var(--border);margin-bottom:2px;
}
.qmenu-head:hover{background:rgba(255,255,255,.06)}
.qopt{
  padding:9px 16px;font-size:13px;font-weight:500;
  color:var(--text2);cursor:pointer;transition:all .1s;white-space:nowrap;
  display:flex;align-items:center;gap:10px;
}
.qopt:hover{background:rgba(255,255,255,.08);color:var(--text)}
.qopt.active{color:var(--accent)}
.qopt .check{font-size:13px;opacity:0;flex-shrink:0}
.qopt.active .check{opacity:1}
.qtag{
  font-size:9px;font-weight:700;color:var(--accent);
  border:1px solid var(--accent);border-radius:3px;padding:1px 4px;
  letter-spacing:.03em;margin-left:auto;
}
.qopt[data-q="2160"] .qtag{color:var(--fifa);border-color:var(--fifa)}

/* Theater mode */
.player-col.theater{max-width:none}
.player-col.theater .player-screen{max-height:none;aspect-ratio:auto;flex:1 1 80vh}
.body.theater-active{flex-direction:column}
.body.theater-active .sidebar{
  width:100%;min-width:0;max-height:220px;border-right:none;border-top:1px solid var(--border);
}
@media (min-width:681px){
  .body.theater-active{flex-direction:column}
}

.now-bar{
  display:none !important;
  align-items:center;gap:12px;
  padding:8px 14px;border-top:1px solid var(--border);
  background:var(--bg2);flex-wrap:wrap;flex-shrink:0;
}
.now-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.now-logo{
  width:32px;height:32px;border-radius:var(--radius-xs);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  font-size:10px;font-weight:700;color:#fff;
}
.now-meta{min-width:0}
.now-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-sub{font-size:10.5px;color:var(--text3);margin-top:1px}
.now-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.icon-btn{
  width:32px;height:32px;border-radius:var(--radius-xs);
  background:rgba(255,255,255,0.03);border:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text2);transition:all .15s;flex-shrink:0;
}
.icon-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.icon-btn.active{background:rgba(79,125,240,0.12);color:var(--accent);border-color:rgba(79,125,240,0.25)}
.icon-btn i{font-size:15px}
.vol-row{display:flex;align-items:center;gap:5px;flex-shrink:0}
.vol-row i{font-size:13px;color:var(--text3)}
.vol-row input{width:68px;accent-color:var(--accent)}
.divider{width:1px;height:20px;background:var(--border);flex-shrink:0}

.footer{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:8px 16px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;
}
.footer-privacy{font-size:10.5px;color:rgba(74,222,128,.75);display:flex;align-items:center;gap:5px}
.footer-copy{font-size:10.5px;color:var(--text3)}
.footer-copy a{color:var(--accent);text-decoration:none;font-weight:600}
.footer-copy a:hover{text-decoration:underline}

@media (max-width:680px){
  html,body{overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  .tv-app{height:auto;min-height:100dvh}
  .body{flex-direction:column;overflow:visible}

  .topbar{padding:8px 12px;gap:6px}
  .topbar-search{width:100%;max-width:none;order:3;flex-basis:calc(100% - 0px)}
  .topbar-search input{font-size:14px}
  .cat-row{order:4;width:100%;flex-basis:100%;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .cat-btn{scroll-snap-align:start}

  .sidebar{
    width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--border);
    overflow:visible;padding:0;display:block;
  }
  .mobile-scroll{
    display:flex;overflow-x:auto;gap:6px;padding:8px 10px;scrollbar-width:none;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
    scroll-padding:10px;
  }
  .mobile-scroll::-webkit-scrollbar{display:none}
  .ch-card{
    flex-direction:column;align-items:center;
    min-width:64px;max-width:64px;
    padding:9px 5px 7px;gap:5px;margin:0;text-align:center;
    scroll-snap-align:start;
    transition:background .18s,box-shadow .18s,transform .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .ch-card:active{transform:scale(.94);background:var(--bg3)}
  .ch-card.active{box-shadow:inset 0 -3px 0 var(--accent);background:var(--bg3)}
  .ch-logo,.ch-avatar{width:36px;height:36px;transition:transform .15s}
  .ch-card:active .ch-logo,.ch-card:active .ch-avatar{transform:scale(.92)}
  .ch-n{font-size:9.5px;text-align:center;line-height:1.3}
  .ch-s,.soon-tag{display:none}
  .live-pip{position:absolute;top:6px;right:6px}
  .section-label{display:none}

  .player-screen{flex:1 1 auto;min-height:0}
  .now-bar{padding:7px 10px;gap:8px}
  .now-brand{flex-basis:100%}
  .now-controls{flex-basis:100%;justify-content:space-between}
  .vol-row input{flex:1}
  .divider{display:none}
  .ctrl-bar{gap:6px;padding:7px 8px}
  .ctrl-btn{width:34px;height:34px;-webkit-tap-highlight-color:transparent}
  .ctrl-btn:active{transform:scale(.9);background:rgba(255,255,255,0.12)}

        </div>

          <button class="icon-btn" id="mutebtn" onclick="toggleMute()" title="Mute">
            <i class="ti ti-volume"></i>

        </div>
      </div>
    </div>

};

let activeCat="FIFA 2026",activeId=null,searchQ="",hlsInst=null,isPlaying=false,currentQuality="1080";
const isMobile=()=>window.innerWidth<=680;

/* ── BUILD CATS ── */
function buildCats(){
  const c=document.getElementById("cats");
  if(!c) return;
  c.innerHTML = "";
  Object.keys(catCfg).forEach(cat=>{
    const b=document.createElement("button");
    b.className="cat-pill"+(cat===activeCat?" "+catCfg[cat].cls:"");
    b.dataset.cat=cat;
    const icon=cat==="FIFA 2026"?`<i class="ti ti-trophy" style="font-size:11px;color:#ffd700"></i>`:`<i class="ti ${catCfg[cat].icon}" style="font-size:11px"></i>`;
    b.innerHTML=icon+cat;
    b.onclick=()=>{
      activeCat=cat;
      document.querySelectorAll(".cat-pill").forEach(x=>{x.className="cat-pill"});
      b.className="cat-pill "+catCfg[cat].cls;
      renderSidebar();
    };
    c.appendChild(b);
  });
}

/* ── RENDER SIDEBAR ── */
function renderSidebar(){
  const s=document.getElementById("sidebar");
  if(!s) return;
  const cats=activeCat==="All"?Object.keys(catCfg).filter(x=>x!=="All"):[activeCat];
  const mobile=isMobile();

  if(mobile){
    let html='<div class="mobile-scroll">';
    cats.forEach(cat=>{
      channels.filter(c=>c.cat===cat&&matches(c)).forEach(ch=>{ html+=chCard(ch,true); });
    });
    html+='</div>';
    const found=cats.some(cat=>channels.filter(c=>c.cat===cat&&matches(c)).length>0);
    if(!found)html=emptyHtml();
    s.innerHTML=html;
  } else {
    let html="";
    cats.forEach(cat=>{
      const chs=channels.filter(c=>c.cat===cat&&matches(c));
      if(!chs.length)return;
      const isFifa=cat==="FIFA 2026";
      html+=`<div class="section-label${isFifa?" fifa-label":""}">
        <i class="ti ${catCfg[cat].icon}" style="font-size:12px"></i>${cat}
        ${isFifa?`<span style="font-size:9px;margin-left:2px;opacity:.7">⚽ Live Now</span>`:""}
      </div>`;
      chs.forEach(ch=>{ html+=chCard(ch,false); });
    });
    if(!html)html=emptyHtml();
    s.innerHTML=html;
  }
}

function matches(c){return c.name.toLowerCase().includes(searchQ.toLowerCase())||c.sub.toLowerCase().includes(searchQ.toLowerCase())}
function emptyHtml(){return '<div class="no-ch"><i class="ti ti-search"></i>No channels found</div>'}

function chCard(ch,mobile){
  const logoEl=ch.logo?`<img class="ch-logo" src="${ch.logo}" alt="${ch.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:``;
  const avEl=ch.logo
    ?`<div class="ch-avatar" style="background:${ch.bg||'var(--bg3)'};color:${ch.txt||'var(--text2)'};display:none">${ch.abbr||ch.name.substring(0,3).toUpperCase()}</div>`
    :`<div class="ch-avatar" style="background:${ch.bg||'var(--bg3)'};color:${ch.txt||'var(--text2)'}">${ch.abbr||ch.name.substring(0,3).toUpperCase()}</div>`;
  const noUrl=!ch.url?" no-url":"";
  const pip=`<div class="live-pip ${pipCls[ch.cat]||'pip-bd'}"></div>`;
  return `<div class="ch-card${activeId===ch.id?" active":""}${noUrl}" onclick="selectAndPlay(${ch.id})">
    <div style="position:relative;flex-shrink:0">${logoEl}${avEl}</div>
    <div class="ch-meta"><div class="ch-n">${ch.name}</div><div class="ch-s">${ch.sub}</div></div>
    ${pip}
    ${!ch.url&&!mobile?`<span class="soon-tag">Soon</span>`:`<span></span>`}
  </div>`;
}

function doFilter(){searchQ=document.getElementById("srch").value;renderSidebar();}

/* ── SHOW STATES ── */
function showLoading(ch){
  document.getElementById("idle").style.display="none";
  document.getElementById("vwrap").style.display="none";
  document.getElementById("screen-grad").style.display="none";
  document.getElementById("quality-badge").style.display="none";
  const ld=document.getElementById("loading");ld.style.display="flex";
  document.getElementById("loading-ch").textContent="Loading "+ch.name+"…";
  const ll=document.getElementById("loading-logo");
  if(ch.logo){ll.src=ch.logo;ll.style.display="block";}else{ll.style.display="none";}
  document.getElementById("pbar").style.width="0%";
  const pd0=document.getElementById("pbardot"); if(pd0) pd0.style.left="0%";
}
function showError(msg){
  const e=document.getElementById("errmsg");e.textContent=msg;e.style.display="block";
  setTimeout(()=>{e.style.display="none"},4000);
}

/* ── PLAYER LOGIC ── */
function destroyHls(){
  if(hlsInst){hlsInst.destroy();hlsInst=null;}
  const v=document.getElementById("vid"); if(v){v.pause();v.src="";}
}

function stopStream(){
  destroyHls();activeId=null;isPlaying=false;
  document.getElementById("vwrap").style.display="none";
  document.getElementById("loading").style.display="none";
  document.getElementById("idle").style.display="flex";
  document.getElementById("ptl").style.display="none";
  document.getElementById("screen-grad").style.display="none";
  document.getElementById("quality-badge").style.display="none";
  document.getElementById("prog-t").textContent="NhLiveZone";
  document.getElementById("prog-s").textContent="Select a channel to start";
  document.getElementById("pbar").style.width="0%";
  setPlayIcon(false);
  const screen=document.getElementById("screen");
  if(screen) screen.classList.add("is-idle");
  const nl=document.getElementById("now-logo-wrap");
  nl.innerHTML="<span>Nh</span>";nl.style.cssText="";
  renderSidebar();
}

function setPlayIcon(playing){
  const icon = document.getElementById("play-icon");
  if(icon) icon.className=playing?"ti ti-player-pause":"ti ti-player-play";
  const screen = document.getElementById("screen");
  if(screen) screen.classList.toggle("is-paused", !playing && !!activeId);
}

function togglePlay(){
  const v=document.getElementById("vid");
  if(!activeId){showError("Select a channel first");return;}
  if(v.paused||v.ended){v.play().catch(()=>{});isPlaying=true;}
  else{v.pause();isPlaying=false;}
  setPlayIcon(isPlaying);
}

function seekBack(){
  if(!activeId) return;
  selectAndPlay(activeId,true);
}

function selectAndPlay(id,force=false){
  if(activeId===id && !force) return;
  activeId=id;renderSidebar();
  const ch=channels.find(c=>c.id===id);
  const screen0=document.getElementById("screen");
  if(screen0) screen0.classList.remove("is-idle");

  document.getElementById("ch-now").textContent=ch.name;
  document.getElementById("prog-t").textContent=ch.name;
  document.getElementById("prog-s").textContent=ch.cat+" · "+ch.sub;

  const tag=document.getElementById("live-tag");
  tag.style.background=tagCls[ch.cat]||"#5b9bff";
  document.getElementById("ptl").style.display="flex";

  const nl=document.getElementById("now-logo-wrap");
  if(ch.logo){
    nl.innerHTML=`<img src="${ch.logo}" alt="${ch.name}" style="width:100%;height:100%;object-fit:contain;border-radius:7px;background:var(--bg3);padding:2px" onerror="this.parentElement.innerHTML='<span>${ch.abbr||ch.name.substring(0,2)}</span>'">`;
    nl.style.background="var(--bg3)";nl.style.border="1px solid var(--border)";
  } else {
    nl.innerHTML=`<span>${ch.abbr||ch.name.substring(0,2).toUpperCase()}</span>`;
    nl.style.background=`${ch.bg||'var(--accent)'}`;nl.style.border="none";
  }

  if(!ch.url){showError("Stream URL coming soon!");return;}

  destroyHls();showLoading(ch);
  const vid=document.getElementById("vid");
  vid.volume=document.querySelector("input[type='range']").value/100;

  let prog=0;
  const pi=setInterval(()=>{prog=Math.min(prog+Math.random()*8,90);const p=Math.round(prog)+"%";document.getElementById("pbar").style.width=p;const pd=document.getElementById("pbardot");if(pd)pd.style.left=p;},150);

  function onReady(){
    clearInterval(pi);
    document.getElementById("pbar").style.width="100%";
    const pd1=document.getElementById("pbardot"); if(pd1) pd1.style.left="100%";
    document.getElementById("loading").style.display="none";
    document.getElementById("vwrap").style.display="block";
    document.getElementById("screen-grad").style.display="block";

    // Apply default quality (Full HD) once levels are known
    if(hlsInst && currentQuality!=="auto"){
      const levels=hlsInst.levels;
      let best=-1,bestDiff=99999;
      levels.forEach((l,i)=>{const diff=Math.abs(l.height-parseInt(currentQuality));if(diff<bestDiff){bestDiff=diff;best=i;}});
      if(best>=0) hlsInst.currentLevel=best;
    }

    const qb=document.getElementById("quality-badge");
    qb.textContent=currentQuality==="auto"?"AUTO":currentQuality+"p";
    qb.style.display="block";
    vid.play().catch(()=>{});
    isPlaying=true;setPlayIcon(true);
    setTimeout(()=>{
      document.getElementById("pbar").style.width="0%";
      const pd2=document.getElementById("pbardot"); if(pd2) pd2.style.left="0%";
    },400);
  }

  if(Hls.isSupported()){
    hlsInst=new Hls({enableWorker:true,lowLatencyMode:true,startLevel:-1});
    hlsInst.loadSource(ch.url);
    hlsInst.attachMedia(vid);
    hlsInst.on(Hls.Events.MANIFEST_PARSED,onReady);
    hlsInst.on(Hls.Events.ERROR,(_,d)=>{
      console.error("[NhLiveZone] HLS error for "+ch.name+":",d.type,d.details,d);
      if(d.fatal){
        clearInterval(pi);
        document.getElementById("loading").style.display="none";
        document.getElementById("idle").style.display="flex";
        showError("Stream failed ("+d.details+") — please try again");
        isPlaying=false;setPlayIcon(false);
      }
    });
  } else if(vid.canPlayType("application/vnd.apple.mpegurl")){
    vid.src=ch.url;
    vid.addEventListener("loadedmetadata",onReady,{once:true});
  } else {
    clearInterval(pi);
    document.getElementById("loading").style.display="none";
    document.getElementById("idle").style.display="flex";
    showError("Browser not supporting HLS");
  }
}

/* ── UTILS ── */
function toggleQMenu(){ document.getElementById("qmenu").classList.toggle("open"); }
document.addEventListener("click",e=>{
  if(!document.getElementById("qwrap").contains(e.target))
    document.getElementById("qmenu").classList.remove("open");
});

function setQuality(q){
  currentQuality=q;
  document.querySelectorAll(".qopt").forEach(x=>x.classList.remove("active"));
  document.querySelector(`.qopt[data-q="${q}"]`).classList.add("active");
  document.getElementById("qmenu").classList.remove("open");
  const qb=document.getElementById("quality-badge");
  if(qb.style.display!=="none"){
    qb.textContent = q==="auto" ? "AUTO" : (q==="2160" ? "4K" : q+"p");
  }
  if(hlsInst){
    if(q==="auto"){hlsInst.currentLevel=-1;}
    else{
      const levels=hlsInst.levels;
      let best=-1,bestDiff=99999;
      levels.forEach((l,i)=>{const diff=Math.abs(l.height-parseInt(q));if(diff<bestDiff){bestDiff=diff;best=i;}});
      if(best>=0)hlsInst.currentLevel=best;
    }
  }
}

/* ── FULLSCREEN FIX ── */
function doFS(){
  const el = document.getElementById("player-wrapper");
  
  if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
    if (el.requestFullscreen) {
      el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) { /* Safari */
      el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) { /* IE11 */
      el.msRequestFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) { /* Safari */
      document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) { /* IE11 */
      document.msExitFullscreen();
    }
  }
}

// Update fullscreen icon on state change
function updateFsIcon() {
  const icon = document.querySelector('#fs-btn i');
  if(!icon) return;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    icon.className = "ti ti-maximize";
  } else {
    icon.className = "ti ti-minimize";
  }
}
document.addEventListener('fullscreenchange', updateFsIcon);
document.addEventListener('webkitfullscreenchange', updateFsIcon);

function toggleMute(){
  const v=document.getElementById("vid");v.muted=!v.muted;
  const ico=v.muted?'<i class="ti ti-volume-off"></i>':'<i class="ti ti-volume"></i>';
  document.getElementById("mutebtn").innerHTML=ico;
  document.getElementById("mutebtn2").innerHTML=ico;
  const vw=document.getElementById("volwrap");
  if(vw) vw.classList.toggle("show", !v.muted);
}
function setVol(val){
  const v=document.getElementById("vid");
  if(v){v.volume=val/100; v.muted=val==0;}
  const ico=(val==0)?'<i class="ti ti-volume-off"></i>':'<i class="ti ti-volume"></i>';
  const m2=document.getElementById("mutebtn2"); if(m2) m2.innerHTML=ico;
}

function seekClick(e){
  if(!activeId){return;}
  // Live streams: clicking always just shows it's LIVE; could be extended for DVR/seek support later.
  showError("This is a live stream — seeking isn't available");
}

/* ── CAPTIONS (placeholder toggle, enables if a text track exists) ── */
let ccOn=false;
function toggleCC(){
  const v=document.getElementById("vid");
  ccOn=!ccOn;
  const btn=document.getElementById("ccbtn");
  if(v && v.textTracks && v.textTracks.length){
    for(let i=0;i<v.textTracks.length;i++) v.textTracks[i].mode = ccOn?"showing":"hidden";
  } else if(ccOn){
    showError("No captions available for this channel");
    ccOn=false;
    return;
  }
  btn.style.color = ccOn?"var(--accent)":"";
}

/* ── PICTURE IN PICTURE ── */
async function togglePiP(){
  const v=document.getElementById("vid");
  if(!v || !activeId){showError("Select a channel first");return;}
  try{
    if(document.pictureInPictureElement){
      await document.exitPictureInPicture();
    } else if(document.pictureInPictureEnabled){
      await v.requestPictureInPicture();
    } else {
      showError("Picture-in-Picture not supported");
    }
  }catch(err){ showError("Couldn't start Picture-in-Picture"); }
}

let lastMobile=isMobile();
window.addEventListener("resize",()=>{const m=isMobile();if(m!==lastMobile){lastMobile=m;renderSidebar();}});

/* ── AUTO-HIDE CONTROLS ── */
let hideTimer=null;
function showControlsNow(){
  const screen=document.getElementById("screen");
  if(!screen) return;
  screen.classList.add("show-controls");
  screen.classList.remove("cursor-hidden");
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{
    screen.classList.remove("show-controls");
    if(isPlaying) screen.classList.add("cursor-hidden");
  },2800);
}
(function initAutoHide(){
  const screen=document.getElementById("screen");
  if(!screen) return;
  screen.addEventListener("mousemove",showControlsNow);
  screen.addEventListener("mouseenter",showControlsNow);
  screen.addEventListener("click",showControlsNow);
  screen.addEventListener("mouseleave",()=>{
    clearTimeout(hideTimer);
    if(isPlaying){
      screen.classList.remove("show-controls");
      screen.classList.add("cursor-hidden");
    }
  });
})();

window.addEventListener("DOMContentLoaded", () => {
  buildCats();
  renderSidebar();
});
</script>
