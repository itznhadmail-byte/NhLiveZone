<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <title>Live TV App</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0a0a0f; color: #fff; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    
    /* প্লেয়ার স্টাইল */
    .player-container { width: 100%; background: #000; aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; }
    
    /* সাইডবার স্টাইল */
    .sidebar { flex: 1; overflow-y: auto; background: #111; padding: 10px; }
    .channel-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: #1e1e2e; margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
    .channel-item.active { border: 1px solid #a78bfa; }
    
    /* রেসপন্সিভ লেআউট (ডেস্কটপে পাশাপাশি, মোবাইলে উপরে-নিচে) */
    @media (min-width: 768px) {
      .app { flex-direction: row; }
      .player-container { width: 70%; aspect-ratio: auto; height: 100vh; }
      .sidebar { width: 30%; }
    }
  </style>
</head>
<body>

<div class="app">

  </div>

  </div>
</div>

<script>
  const video = document.getElementById('video');
  let hls = new Hls();

  function loadChannel(el, url) {
    document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    if (Hls.isSupported()) {
      hls.destroy();
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      video.play();
    }
  }

  // ডিফল্ট প্রথম চ্যানেল
  window.onload = () => {
    loadChannel(document.querySelector('.channel-item'), 'https://tvsen6.aynaott.com/anandatv/index.m3u8?e=1779283759&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=504b9350b4703116ca4ab20e4013288e');
  };
</script>

</body>
</html>
