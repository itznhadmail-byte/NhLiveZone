<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangla Episode - Live IPTV</title>
  <!-- Tabler Icons for UI -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <!-- HLS.js for video streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* বেসিক স্টাইল */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #e8e8f0; min-height: 100vh; }
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    
    /* টপবার */
    .topbar { padding: 15px 25px; background: #111118; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 20px; font-weight: bold; color: #a78bfa; }

    /* মেইন লেআউট */
    .main { display: flex; flex: 1; overflow: hidden; }
    
    /* সাইডবার */
    .sidebar { width: 280px; background: #0e0e18; border-right: 1px solid #222; overflow-y: auto; height: calc(100vh - 65px); }
    .sidebar-section { margin-top: 20px; }
    .sidebar-title { font-size: 11px; font-weight: bold; color: #666; padding: 0 20px 10px; text-transform: uppercase; }
    .channel-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; transition: 0.2s; border-left: 3px solid transparent; }
    .channel-item:hover { background: #1a1a28; }
    .channel-item.active { background: #1e1e2e; border-left: 3px solid #a78bfa; color: #a78bfa; }
    .channel-logo { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
    
    /* কন্টেন্ট */
    .content { flex: 1; padding: 25px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
    .player-section { width: 100%; max-width: 900px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #222; }
    video { width: 100%; aspect-ratio: 16/9; }

    /* মোবাইল রেসপনসিভ */
    @media (max-width: 767px) {
      .main { flex-direction: column; }
      .sidebar { width: 100%; height: 350px; }
      .content { padding: 15px; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo">Bangla Episode</div>
  </div>

  <div class="main">
    <div class="sidebar">
      
      <!-- ক্যাটাগরি ১: সংবাদ -->
      <div class="sidebar-section">
        <div class="sidebar-title">সংবাদ (News)</div>
        <div class="channel-item active" onclick="selectChannel(this, 'https://tvsen6.aynaott.com/somoytv/index.m3u8?e=1779283766&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=269246b8a31fb3a656624d71e10e447d')">
          <div class="channel-logo" style="background:#0a1e3d; color:#60a5fa">ST</div>
          <span>Somoy News</span>
        </div>
      </div>

      <!-- ক্যাটাগরি ২: বিনোদন -->
      <div class="sidebar-section">
        <div class="sidebar-title">বিনোদন (Entertainment)</div>
        <div class="channel-item" onclick="selectChannel(this, 'https://tvsen6.aynaott.com/anandatv/index.m3u8?e=1779283759&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=504b9350b4703116ca4ab20e4013288e')">
          <div class="channel-logo" style="background:#2d1b4e; color:#a78bfa">AT</div>
          <span>Ananda TV</span>
        </div>
        <div class="channel-item" onclick="selectChannel(this, 'https://tvsen5.aynaott.com/DeeptoTVHD/index.m3u8?e=1779283753&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=12455a1472f0cbf29e22967cc44a49c0')">
          <div class="channel-logo" style="background:#0a1e1e; color:#2dd4bf">DT</div>
          <span>Deepto TV</span>
        </div>
      </div>

      <!-- ক্যাটাগরি ৩: খেলাধুলা -->
      <div class="sidebar-section">
        <div class="sidebar-title">খেলাধুলা (Sports)</div>
        <div class="channel-item" onclick="selectChannel(this, 'https://tvsen7.aynaott.com/tsports-hd/index.m3u8?e=1779283784&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=3b4c5a2cfa872fa7f91ffbfb4aa0f658')">
          <div class="channel-logo" style="background:#2d1b4e; color:#a78bfa">TS</div>
          <span>T Sports</span>
        </div>
      </div>

    </div>

    <div class="content">
      <div class="player-section">
        <video id="video" controls autoplay playsinline></video>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  let hls = new Hls();

  function selectChannel(el, url) {
    // অ্যাক্টিভ ক্লাস সেট করা
    document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    // ভিডিও লোড করা
    if (Hls.isSupported()) {
      hls.destroy();
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    }
  }

  // পেজ লোড হওয়ার সাথে সাথে প্রথম চ্যানেল প্লে করা
  window.onload = () => {
    const firstChannel = document.querySelector('.channel-item');
    if(firstChannel) firstChannel.click();
  };
</script>

</body>
</html>
