<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NhLiveZone - Live IPTV</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;background:#0a0a0f;color:#e8e8f0}
  
  /* মোবাইল ফ্রেন্ডলি ডিজাইন */
  .app{display:flex;flex-direction:column;min-height:100vh}
  .main{display:flex;flex-direction:column;flex:1}
  
  @media (min-width: 768px) {
    .main{flex-direction:row;height:calc(100vh - 60px)}
    .sidebar{width:280px;height:100%;overflow-y:auto}
    .content{height:100%;overflow-y:auto}
  }

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#111118;border-bottom:1px solid #222}
  .logo{font-weight:bold;color:#a78bfa}
  .sidebar{background:#0e0e18;border-bottom:1px solid #222;padding:15px 0}
  .sidebar-section{margin-bottom:15px}
  .sidebar-title{font-size:10px;color:#555;padding:0 16px;margin-bottom:8px;text-transform:uppercase}
  .channel-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent}
  .channel-item.active{background:rgba(167,139,250,0.1);border-left:3px solid #a78bfa}
  .channel-logo{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;background:#1a1a28}
  .content{flex:1;padding:15px}
  
  .player-section{background:#000;border-radius:8px;overflow:hidden;position:relative;width:100%;max-width:800px;margin:0 auto}
  .player-wrap{position:relative;width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%}
  .ctrl-btn{color:#fff;padding:10px;background:none;border:none;cursor:pointer}
  
  /* মোবাইল রেসপন্সিভ ফিক্স */
  @media (max-width: 767px) {
    .sidebar{max-height:300px;overflow-y:scroll}
  }
  </style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo">StreamBD</div>
  </div>

  <div class="main">
    <div class="content">
      <div class="player-section">
        <div class="player-wrap">
          <video id="video" controls playsinline></video>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">চ্যানেল লিস্ট</div>
        <!-- চ্যানেল লিস্ট শুরু -->
        <div class="channel-item active" onclick="loadStream(this, 'https://tvsen6.aynaott.com/anandatv/index.m3u8?e=1779283759&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=504b9350b4703116ca4ab20e4013288e')">
          <div class="channel-logo">AT</div><span>Ananda TV</span>
        </div>
        <div class="channel-item" onclick="loadStream(this, 'https://tvsen6.aynaott.com/banglatv/index.m3u8?e=1779283758&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=f3e9e2737e35147900c0f4add619ead6')">
          <div class="channel-logo">BT</div><span>Bangla TV</span>
        </div>
        <!-- আপনি এখানে আগের মতই বাকি ২৫টি চ্যানেল যোগ করতে পারবেন -->
      </div>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
let hls = new Hls();

function loadStream(el, url) {
  document.querySelectorAll('.channel-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');

  if (Hls.isSupported()) {
    hls.destroy();
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    video.play();
  }
}
</script>

</body>
</html>
