<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamBD - Categorized IPTV</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:sans-serif;background:#0a0a0f;color:#e8e8f0;min-height:100vh}
    .app{display:flex;flex-direction:column;min-height:100vh;background:#0a0a0f}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#111118;border-bottom:0.5px solid rgba(255,255,255,0.08)}
    .logo{font-size:18px;font-weight:500;color:#a78bfa}
    .main{display:flex;flex:1;overflow:hidden;}
    .sidebar{width:260px;background:#0e0e18;border-right:0.5px solid rgba(255,255,255,0.07);overflow-y:auto;height:calc(100vh - 60px);padding-bottom:20px}
    .sidebar-section{margin-top:20px}
    .sidebar-title{font-size:11px;font-weight:700;color:#555;padding:0 16px 8px;text-transform:uppercase;letter-spacing:1px}
    .channel-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:0.2s}
    .channel-item:hover{background:rgba(167,139,250,0.06)}
    .channel-item.active{background:rgba(167,139,250,0.1);border-left:3px solid #a78bfa}
    .channel-logo{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}
    .ch-name{font-size:13px;color:#c8c8d8}
    .content{flex:1;padding:20px;overflow-y:auto}
    .player-section{background:#111118;border-radius:12px;overflow:hidden;max-width:800px;margin:0 auto}
    video{width:100%;aspect-ratio:16/9;background:#000}
    @media (max-width:767px){.main{flex-direction:column}.sidebar{width:100%;height:300px}.player-section{max-width:100%}}
  </style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo">Stream<span>BD</span></div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">সংবাদ (News)</div>
        <div class="channel-item" onclick="selectChannel(this, 'Somoy News', 'https://tvsen6.aynaott.com/somoytv/index.m3u8?e=1779283766&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=269246b8a31fb3a656624d71e10e447d')">
          <div class="channel-logo" style="background:#0a1e3d;color:#60a5fa">ST</div>
          <span class="ch-name">Somoy News</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">বিনোদন (Entertainment)</div>
        <div class="channel-item active" onclick="selectChannel(this, 'Ananda TV', 'https://tvsen6.aynaott.com/anandatv/index.m3u8?e=1779283759&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=504b9350b4703116ca4ab20e4013288e')">
          <div class="channel-logo" style="background:#2d1b4e;color:#a78bfa">AT</div>
          <span class="ch-name">Ananda TV</span>
        </div>
        <div class="channel-item" onclick="selectChannel(this, 'Deepto TV', 'https://tvsen5.aynaott.com/DeeptoTVHD/index.m3u8?e=1779283753&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=12455a1472f0cbf29e22967cc44a49c0')">
          <div class="channel-logo" style="background:#0a1e1e;color:#2dd4bf">DT</div>
          <span class="ch-name">Deepto TV</span>
        </div>
        <div class="channel-item" onclick="selectChannel(this, 'RTV', 'https://tvsen5.aynaott.com/RtvHD/index.m3u8?e=1779283751&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=678f1f8ec03b1af7b76d013d33f45198')">
          <div class="channel-logo" style="background:#0a1e1e;color:#2dd4bf">RT</div>
          <span class="ch-name">RTV</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">খেলাধুলা (Sports)</div>
        <div class="channel-item" onclick="selectChannel(this, 'T Sports', 'https://tvsen7.aynaott.com/tsports-hd/index.m3u8?e=1779283784&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=3b4c5a2cfa872fa7f91ffbfb4aa0f658')">
          <div class="channel-logo" style="background:#2d1b4e;color:#a78bfa">TS</div>
          <span class="ch-name">T Sports HD</span>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="player-section">
        <video id="video" controls autoplay playsinline></video>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  let hls = new Hls();

  function selectChannel(el, name, url) {
    document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    if (Hls.isSupported()) {
      hls.destroy();
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    }
  }

  // Load first channel on start
  window.onload = () => selectChannel(document.querySelector('.channel-item'), 'Ananda TV', 'https://tvsen6.aynaott.com/anandatv/index.m3u8?e=1779283759&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=504b9350b4703116ca4ab20e4013288e');
</script>

</body>
</html>
